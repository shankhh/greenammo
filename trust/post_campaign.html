<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campaign Details - GreenAmmo Trust</title>
    <link rel="icon" type="image/svg+xml" href="./trust.png" />

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "trust-dark":    "#1D371F",
              "trust-primary": "#7C966A",
              "trust-accent":  "#6E8546",
              "trust-light":   "#D2E3AB",
              "brand-base":    "#F8F9FA", 
              "brand-dark":    "#1D371F",
              "brand-accent":  "#6E8546",
              "brand-light":   "#D2E3AB",
            },
            fontFamily: {
              'sans': ['Inter', 'sans-serif'],
              'heading': ['Bricolage Grotesque', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <style>
        body { font-family: "Inter", sans-serif; background-color: #F8F9FA; overflow-x: hidden; }
        
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); } 
        }

        .animate-marquee {
            animation: scroll 40s linear infinite;
        }

        .hover\:pause:hover {
            animation-play-state: paused;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        #page-content p {
            text-align: justify;
            margin-bottom: 1.5em;
            line-height: 1.9;
            color: #374151;
        }

        /* Essential for unblocking images inside prose */
        .marquee-container {
            display: flex;
            overflow: hidden;
            width: 100vw;
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw;
            margin-right: -50vw;
            background: transparent;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen" x-data="{ lightboxOpen: false, lightboxSrc: '' }">

    <div 
        x-show="lightboxOpen" 
        x-transition.opacity.duration.300ms
        class="fixed inset-0 z-[100] flex items-center justify-center bg-black/95 backdrop-blur-sm p-4"
        style="display: none;"
    >
        <button @click="lightboxOpen = false" class="absolute top-6 right-6 text-white/80 hover:text-white transition transform hover:scale-110">
            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <img :src="lightboxSrc" class="max-w-full max-h-[90vh] object-contain rounded-lg shadow-2xl" @click.outside="lightboxOpen = false">
    </div>

    <div id="site-nav"></div>

    <main class="flex-grow">
        <section class="bg-trust-dark text-white relative py-20 md:py-24 text-center overflow-hidden">
            <div class="container mx-auto px-4 relative z-10">
                <span class="inline-flex items-center gap-2 py-1 px-3 rounded-full bg-trust-primary/30 text-trust-light text-xs font-bold uppercase tracking-widest border border-trust-primary/40 mb-6">Campaign Report</span>
                <h1 id="page-title" class="text-4xl md:text-6xl font-extrabold mb-6 max-w-4xl mx-auto leading-tight text-white tracking-tight">Loading...</h1>
            </div>
        </section>

        <div class="container mx-auto px-4 -mt-16 md:-mt-20 relative z-20 max-w-5xl">
            <div id="hero-image-container" class="rounded-3xl overflow-hidden shadow-2xl bg-gray-100 aspect-video md:aspect-[21/9] border-4 border-white ring-1 ring-gray-200/50"></div>
        </div>

        <section class="pb-20 pt-12 bg-brand-base">
            <div class="container mx-auto px-4 max-w-3xl">
                <div id="page-content" class="prose prose-lg prose-headings:font-heading prose-headings:text-trust-dark prose-headings:text-center max-w-none">
                    <div class="skeleton h-4 w-full rounded mb-4"></div>
                    <div class="skeleton h-4 w-5/6 rounded mb-4"></div>
                    <div class="skeleton h-4 w-full rounded"></div>
                </div>
            </div>
        </section>
    </main>
    <div id="site-footer"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug");
        const titleEl = document.getElementById("page-title");
        const heroContainer = document.getElementById("hero-image-container");
        const contentEl = document.getElementById("page-content");

        function openLightbox(src) {
            const body = document.querySelector('body');
            if (body && body.__x) {
                body.__x.$data.lightboxSrc = src;
                body.__x.$data.lightboxOpen = true;
            }
        }

        const createInfiniteMarquee = (sources) => {
            if (sources.length === 0) return null;
            const wrapper = document.createElement('div');
            wrapper.className = "marquee-container my-16"; 
            const track = document.createElement('div');
            track.className = "flex gap-6 h-64 md:h-80 w-max animate-marquee hover:pause";

            let baseSet = [...sources];
            while (baseSet.length < 10) { baseSet = [...baseSet, ...sources]; }
            const renderList = [...baseSet, ...baseSet];

            renderList.forEach(src => {
                const slide = document.createElement('div');
                slide.className = "flex-none h-full w-auto aspect-[4/3] md:aspect-video rounded-xl overflow-hidden shadow-lg border border-gray-100 bg-white hover:scale-[1.02] transition duration-300 cursor-zoom-in";
                const img = document.createElement('img');
                img.src = src;
                img.className = "h-full w-full object-cover block";
                img.onclick = () => openLightbox(src);
                slide.appendChild(img);
                track.appendChild(slide);
            });
            wrapper.appendChild(track);
            return wrapper;
        };

        async function loadCampaign() {
            if (!slug) return;
            try {
                const res = await fetch(`https://cms.greenammo.in/wp-json/wp/v2/pages?slug=${slug}&_embed`);
                const pages = await res.json();
                if (!pages.length) return;
                const page = pages[0];

                titleEl.innerHTML = page.title.rendered;
                const featuredUrl = page._embedded?.["wp:featuredmedia"]?.[0]?.source_url;
                if (featuredUrl) {
                    heroContainer.innerHTML = `<img src="${featuredUrl}" class="w-full h-full object-cover cursor-pointer" onclick="openLightbox('${featuredUrl}')">`;
                }

                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = page.content.rendered;
                
                // Aggressive image extraction and grouping
                const nodes = Array.from(tempDiv.childNodes);
                const processed = [];
                let currentImgs = [];

                nodes.forEach(node => {
                    const img = node.tagName === 'IMG' ? node : node.querySelector?.('img');
                    const isJunk = node.nodeType === 3 && !node.textContent.trim() || node.tagName === 'BR' || (node.tagName === 'P' && !node.innerText.trim() && !node.querySelector('img'));
                    
                    if (img) {
                        currentImgs.push(img.src);
                    } else if (!isJunk) {
                        if (currentImgs.length > 0) {
                            processed.push(currentImgs.length > 1 ? createInfiniteMarquee(currentImgs) : createSingleImg(currentImgs[0]));
                            currentImgs = [];
                        }
                        processed.push(node);
                    }
                });
                
                if (currentImgs.length > 0) {
                    processed.push(currentImgs.length > 1 ? createInfiniteMarquee(currentImgs) : createSingleImg(currentImgs[0]));
                }

                contentEl.innerHTML = '';
                processed.forEach(n => n && contentEl.appendChild(n));

            } catch (e) { console.error(e); }
        }

        function createSingleImg(src) {
            const div = document.createElement('div');
            div.className = "flex justify-center my-8";
            div.innerHTML = `<img src="${src}" class="rounded-2xl shadow-lg max-h-[500px] w-auto cursor-zoom-in" onclick="openLightbox('${src}')">`;
            return div;
        }

        document.addEventListener('alpine:init', loadCampaign);
    </script>
    <script type="module" src="/js/components.js"></script>
</body>
</html>
