<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Campaign</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 text-gray-800">

  <!-- HERO -->
  <section class="bg-brand-dark text-white py-16">
    <div class="container mx-auto px-4 max-w-5xl">
      <h1 class="title text-3xl md:text-5xl font-bold mb-6"></h1>
      <img
        id="heroImage"
        class="w-full max-h-[420px] object-cover rounded-xl hidden"
        alt="Campaign hero"
      />
    </div>
  </section>

  <!-- CONTENT -->
  <section class="py-16 bg-white">
    <div
      class="content container mx-auto px-4 max-w-4xl prose prose-lg"
    ></div>
  </section>

  <!-- GALLERY -->
  <section class="py-16 bg-gray-100">
    <div class="container mx-auto px-4 max-w-6xl">
      <h2 class="text-2xl font-bold mb-6">Gallery</h2>
      <div
        id="gallery"
        class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"
      ></div>
    </div>
  </section>

  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");

    async function loadCampaign() {
      if (!slug) return;

      // 1️⃣ Fetch page WITH embedded media
      const pageRes = await fetch(
        `https://cms.greenammo.in/wp-json/wp/v2/pages?slug=${slug}&_embed`
      );
      const pages = await pageRes.json();
      if (!pages.length) return;

      const page = pages[0];

      // 2️⃣ Title
      document.querySelector(".title").innerHTML =
        page.title.rendered;

      // 3️⃣ Featured image (hero)
      const featured =
        page._embedded?.["wp:featuredmedia"]?.[0]?.source_url;

      if (featured) {
        const hero = document.getElementById("heroImage");
        hero.src = featured;
        hero.classList.remove("hidden");
      }

      // 4️⃣ Fix relative image URLs in content
      let content = page.content.rendered;
      content = content.replaceAll(
        'src="/wp-content',
        'src="https://cms.greenammo.in/wp-content'
      );

      document.querySelector(".content").innerHTML = content;

      // 5️⃣ Fetch gallery images (media attached to page)
      const mediaRes = await fetch(
        `https://cms.greenammo.in/wp-json/wp/v2/media?parent=${page.id}&per_page=50`
      );
      const media = await mediaRes.json();

      const gallery = document.getElementById("gallery");
      gallery.innerHTML = media
        .map(
          (img) => `
          <img
            src="${img.source_url}"
            class="w-full h-60 object-cover rounded-lg"
            alt="${img.alt_text || ""}"
          />
        `
        )
        .join("");
    }

    loadCampaign();
  </script>

</body>
</html>
