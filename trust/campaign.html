<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our Campaigns - GreenAmmo Trust</title>
    <link rel="icon" type="image/svg+xml" href="./trust.png" />

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">


    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Custom Brand Palette (Defined by User Request)
              "brand-dark": "#1D371F", // Primary Dark Green (Headings, Main Text)
              "brand-primary": "#7C966A", // Secondary Olive Green (Borders, Secondary Text)
              "brand-accent": "#6E8546", // Tertiary Vibrant Moss (CTA Background, Highlights)
              "brand-light": "#D2E3AB", // Lightest Green (Light backgrounds, Watermarks)
              "brand-base": "#F7FAF7", // Suggested Off-White Base
              "group-primary-green": "#4CAF50",
              "group-text-dark":     "#1F2937",
              "group-pastel-green":  "#A8D7B0",
              "trust-dark":    "#1D371F",
              "trust-primary": "#7C966A",
              "trust-accent":  "#6E8546",
              "trust-light":   "#D2E3AB",
            },
          },
        },
      };
    </script>
    <style>
        body { font-family: "Inter", sans-serif; background-color: #F9FAFB; }
        h1, h2, h3, h4, .font-heading { font-family: "Bricolage Grotesque", sans-serif; }
        
        .skeleton {
            background: linear-gradient(90deg, #e5e7eb 25%, #d1d5db 50%, #e5e7eb 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        /* Line Clamp for Excerpts */
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .cta-button {
        display: inline-block;
        padding: 0.5rem 1.5rem; /* py-3 px-10 */
        border-radius: 9999px; /* rounded-full */
        font-size: 1.125rem; /* text-lg */
        transition: all 0.3s;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        transform: scale(1);
      }
      .cta-button:hover {
        transform: scale(1.05);
      }

      body {
        font-family: "Inter", sans-serif; /* Keep Inter for body text */
        /* Using the Off-White Base color */
        background-color: #f7fafc;
        /* ... rest of the body styles (watermark, etc.) ... */
      }

      /* NEW: Apply Bricolage Grotesque to all headings */
      h1,
      h2,
      h3,
      h4 {
        font-family: "Bricolage Grotesque", sans-serif;
      }
      /* CORRECTED: Defining cta-button within @layer components */

      /* Custom CSS for continuous scrolling logo/brand banner */
      .scrolling-banner {
        animation: scroll 40s linear infinite;
        display: flex;
        width: fit-content;
      }
      @keyframes scroll {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-50%);
        }
      }
      .scrolling-banner:hover {
        animation-play-state: paused;
      }

      /* Style for the Campaign Image Placeholder (Updated with brand-accent color #6E8546) */
      .campaign-card {
        background: linear-gradient(
            rgba(110, 133, 70, 0.4),
            rgba(110, 133, 70, 0.8)
          ),
          url("https://placehold.co/400x700/6E8546/ffffff?text=Campaign+Image")
            center/cover;
        height: 400px;
        position: relative;
      }
    </style>
</head>

<body class="flex flex-col min-h-screen">
    
    <div id="site-nav"></div>

    <main class="flex-grow">
        <section class="bg-trust-dark text-white relative overflow-hidden py-20 md:py-24">
            <div class="absolute top-0 right-0 w-96 h-96 bg-trust-primary/20 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-trust-accent/20 rounded-full blur-3xl transform -translate-x-1/2 translate-y-1/2"></div>
            
            <div class="container mx-auto px-4 text-center relative z-10">
                <span class="text-trust-light font-bold tracking-widest uppercase text-sm mb-2 block">Our Initiatives</span>
                <h1 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">
                    Campaigns in <span class="text-trust-primary">Action</span>
                </h1>
                <p class="text-gray-300 max-w-2xl mx-auto text-lg">
                    Explore how GreenAmmo Trust is driving sustainable change through community-led projects and on-ground environmental action.
                </p>
            </div>
        </section>

        <section class="py-16 bg-gray-50">
            <div class="container mx-auto px-4 md:px-8 max-w-7xl">
                
                <div id="loader-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden h-full flex flex-col">
                        <div class="h-56 skeleton w-full"></div>
                        <div class="p-6 flex-1 flex flex-col space-y-4">
                            <div class="h-4 bg-gray-200 rounded w-1/3"></div>
                            <div class="h-8 bg-gray-200 rounded w-3/4"></div>
                            <div class="h-4 bg-gray-200 rounded w-full"></div>
                            <div class="h-4 bg-gray-200 rounded w-2/3"></div>
                            <div class="mt-auto pt-4">
                                <div class="h-10 bg-gray-200 rounded-full w-1/2"></div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden h-full flex flex-col hidden md:flex">
                        <div class="h-56 skeleton w-full"></div>
                        <div class="p-6 flex-1 flex flex-col space-y-4">
                            <div class="h-4 bg-gray-200 rounded w-1/3"></div>
                            <div class="h-8 bg-gray-200 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-gray-200 rounded w-full"></div>
                                <div class="h-4 bg-gray-200 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden h-full flex flex-col hidden lg:flex">
                        <div class="h-56 skeleton w-full"></div>
                        <div class="p-6 flex-1 flex flex-col space-y-4">
                            <div class="h-4 bg-gray-200 rounded w-1/3"></div>
                            <div class="h-8 bg-gray-200 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-4 bg-gray-200 rounded w-full"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="campaigns-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 hidden">
                    </div>

                <div id="error-container" class="hidden text-center py-10">
                    <p class="text-red-600 font-semibold">Unable to load campaigns at this moment.</p>
                    <button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-gray-200 rounded hover:bg-gray-300 text-sm">Retry</button>
                </div>

            </div>
        </section>
    </main>

    <div id="site-footer"></div>

<script>
    // --- DOM ELEMENTS ---
    const loader = document.getElementById('loader-grid');
    const container = document.getElementById('campaigns-container');
    const errorContainer = document.getElementById('error-container');

    // --- HELPERS ---
    function stripHtml(html) {
        let tmp = document.createElement("DIV");
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || "";
    }

    function formatDate(dateString) {
        return new Date(dateString).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    // --- NEW FETCH LOGIC (From your reference) ---
    // Loops through all pages to find items with "campaign" in the slug
    async function fetch_campaign_pages() {
        const pages = [];
        let page = 1;
        const limit = 10;

        try {
            while (true) {
                const res = await fetch(
                    `https://cms.greenammo.in/wp-json/wp/v2/pages?per_page=${limit}&page=${page}&_embed`
                );
                
                // Stop if end of content (400) or error
                if (res.status === 400) break;
                if (!res.ok) throw new Error("Fetch failed");

                const data = await res.json();
                if (!data.length) break;

                // Filter: Only keep pages where slug contains "campaign"
                const campaigns = data.filter((p) => p.slug.includes("campaign"));
                
                pages.push(...campaigns);
                page++;
            }
        } catch (error) {
            console.log("Finished fetching or error:", error.message);
        }

        return pages;
    }

    // --- RENDER LOGIC (Grid Version) ---
    async function renderCampaigns() {
        try {
            // 1. Get Data using the new looping function
            const posts = await fetch_campaign_pages();

            // 2. Hide Loader
            loader.classList.add('hidden');

            if (posts.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">No campaigns found.</div>`;
                container.classList.remove('hidden');
                return;
            }

            // 3. Map Data to Grid Cards (Not Carousel Slides)
            const cardsHtml = posts.map(post => {
                const featuredImg = post._embedded?.['wp:featuredmedia']?.[0]?.source_url 
                    || 'https://placehold.co/600x400/e2e8f0/1D371F?text=GreenAmmo+Trust';
                
                // Ensure this points to your details page
                // Point to the actual file containing the details logic
const detailsLink = `post_campaign.html?slug=${post.slug}`;
                const excerpt = post.excerpt?.rendered ? stripHtml(post.excerpt.rendered) : "Click to read more.";

                return `
                    <article class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 overflow-hidden flex flex-col group h-full">
                        <a href="${detailsLink}" class="relative h-56 overflow-hidden block">
                            <div class="absolute inset-0 bg-trust-dark/0 group-hover:bg-trust-dark/10 transition z-10"></div>
                            <img src="${featuredImg}" alt="${post.title.rendered}" class="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700">
                        </a>

                        <div class="p-6 flex-1 flex flex-col">
                            <div class="flex items-center gap-2 mb-3 text-xs font-semibold text-trust-accent uppercase tracking-wider">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                ${formatDate(post.date)}
                            </div>

                            <h2 class="text-xl font-bold text-trust-dark font-heading mb-3 leading-snug group-hover:text-trust-accent transition-colors">
                                <a href="${detailsLink}">
                                    ${post.title.rendered}
                                </a>
                            </h2>

                            <p class="text-gray-600 text-sm line-clamp-3 mb-6 flex-grow">
                                ${excerpt}
                            </p>

                            <div class="mt-auto pt-4 border-t border-gray-100">
                                <a href="${detailsLink}" class="inline-flex items-center gap-2 text-trust-dark font-bold hover:text-trust-accent transition group-hover:gap-3">
                                    Read Full Story
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"></path></svg>
                                </a>
                            </div>
                        </div>
                    </article>
                `;
            }).join('');

            // 4. Inject HTML
            container.innerHTML = cardsHtml;
            container.classList.remove('hidden');

        } catch (error) {
            console.error('Error rendering campaigns:', error);
            loader.classList.add('hidden');
            errorContainer.classList.remove('hidden');
        }
    }

    // Init
    document.addEventListener('DOMContentLoaded', renderCampaigns);
</script>
    <script type="module" src="/js/components.js"></script>
</body>
</html>
