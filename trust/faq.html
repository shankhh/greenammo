<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAQs - GreenAmmo Trust</title>
    <link rel="icon" type="image/svg+xml" href="./trust.png" />

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "trust-dark":    "#1D371F",
              "trust-primary": "#7C966A",
              "trust-accent":  "#6E8546",
              "trust-light":   "#D2E3AB",
              "brand-base":    "#F8F9FA", 
              "brand-dark":    "#1D371F",
              "brand-accent":  "#6E8546",
              "brand-light":   "#D2E3AB",
              "faq-green":     "#347152", /* Matched from the reference image */
            },
            fontFamily: {
              'sans': ['Inter', 'sans-serif'],
              'heading': ['Bricolage Grotesque', 'sans-serif'],
            },
          },
        },
      };
    </script>

    <style>
        body { font-family: "Inter", sans-serif; background-color: #ffffff; overflow-x: hidden; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* FAQ Specific Styling - Targets WP headings as Questions and P as Answers */
        #page-content > h2, 
        #page-content > h3, 
        #page-content > h4,
        #page-content .wp-block-heading {
            background-color: #347152;
            color: #ffffff !important;
            padding: 1.25rem 1.5rem;
            margin-top: 1.5rem;
            margin-bottom: 0;
            font-weight: 600;
            font-size: 1.125rem;
            border-radius: 4px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #page-content > p,
        #page-content > ul,
        #page-content > div:not(.skeleton) {
            padding: 1.25rem 1.5rem 1.5rem 2rem;
            margin-top: 0;
            margin-bottom: 1rem;
            color: #4b5563;
            line-height: 1.8;
            background-color: transparent;
        }

        /* Styling lists inside answers */
        #page-content ul {
            list-style-type: disc;
            padding-left: 3rem;
        }
        
        #page-content a {
            color: #347152;
            text-decoration: underline;
        }
    </style>
</head>

<body class="flex flex-col min-h-screen">

    <div id="site-nav"></div>

    <main class="flex-grow bg-white">
        <section class="pb-24 pt-12 md:pt-16">
            <div class="container mx-auto px-4 max-w-4xl">
                <h1 id="page-title" class="text-4xl md:text-5xl font-heading font-bold mb-10 text-faq-green tracking-tight">FAQs</h1>
                
                <div id="page-content" class="w-full">
                    <div class="skeleton h-14 w-full rounded mb-2 bg-faq-green/20 animate-pulse"></div>
                    <div class="skeleton h-20 w-11/12 rounded mb-6 bg-gray-100 animate-pulse ml-4"></div>
                    
                    <div class="skeleton h-14 w-full rounded mb-2 bg-faq-green/20 animate-pulse"></div>
                    <div class="skeleton h-24 w-11/12 rounded mb-6 bg-gray-100 animate-pulse ml-4"></div>
                    
                    <div class="skeleton h-14 w-full rounded mb-2 bg-faq-green/20 animate-pulse"></div>
                    <div class="skeleton h-16 w-11/12 rounded mb-6 bg-gray-100 animate-pulse ml-4"></div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script>
        // Use 'faqs' slug as the default if not provided in the URL
        const params = new URLSearchParams(window.location.search);
        const slug = params.get("slug") || "faqs"; 
        
        const titleEl = document.getElementById("page-title");
        const contentEl = document.getElementById("page-content");

        async function loadFAQs() {
            try {
                // Fetch content from the WordPress API
                const res = await fetch(`https://cms.greenammo.in/wp-json/wp/v2/pages?slug=${slug}&_embed`);
                const pages = await res.json();
                
                if (!pages || !pages.length) {
                    contentEl.innerHTML = `
                        <div class="bg-red-50 text-red-600 p-4 rounded-md border border-red-200">
                            Sorry, the FAQ content could not be found. Please check back later.
                        </div>`;
                    return;
                }
                
                const page = pages[0];

                // Setting Title
                if (page.title && page.title.rendered) {
                    titleEl.innerHTML = page.title.rendered;
                }

                // Parse and inject the content directly
                // The CSS defined in the <head> block will automatically style WP H2/H3/H4 as the green question boxes
                contentEl.innerHTML = page.content.rendered;

            } catch (e) { 
                console.error("Error fetching FAQs:", e);
                contentEl.innerHTML = `
                    <div class="bg-red-50 text-red-600 p-4 rounded-md border border-red-200">
                        There was an error loading the FAQs. Please try refreshing the page.
                    </div>`;
            }
        }

        // Initialize fetching on page load
        document.addEventListener('DOMContentLoaded', loadFAQs);
    </script>
    <script type="module" src="/js/components.js"></script>
</body>
</html>
