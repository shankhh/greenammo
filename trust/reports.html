<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="../assets/trust.png" /> <!-- Corrected path to trust favicon -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 1. Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. Load Alpine.js for interactivity -->
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <!-- Lenis Smooth Scroll -->
  <script src="https://unpkg.com/lenis@1.3.11/dist/lenis.min.js"></script>

  <title>Reports & Research - GreenAmmo Trust</title>

  <!-- 3. Configure Tailwind with TRUST (Green) Palette & Fonts -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            // Custom Brand Palette (Trust Theme)
            "brand-dark": "#1D371F", // Primary Dark Green
            "brand-primary": "#7C966A", // Secondary Olive Green
            "brand-accent": "#6E8546", // Tertiary Vibrant Moss
            "brand-light": "#D2E3AB", // Lightest Green
            "brand-base": "#F7FAF7", // Off-White Base
          },
          fontFamily: {
            // Setup font families
            'sans': ['Inter', 'sans-serif'],
            'heading': ['Bricolage Grotesque', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fade-in 0.3s ease-out',
            'pulse': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            'fade-in': {
              'from': { opacity: 0, transform: 'translateY(10px)' },
              'to': { opacity: 1, transform: 'translateY(0)' },
            },
            pulse: {
              '0%, 100%': { opacity: 1 },
              '50%': { opacity: .5 },
            }
          }
        },
      },
    };
  </script>

  <!-- 4. Import Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@400;600;700;800&display=swap"
    rel="stylesheet">

  <!-- 5. Apply new font rules and CTA button styles -->
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #F7FAF7;
      /* brand-base */
      color: #1D371F;
      /* brand-dark */
    }

    h1,
    h2,
    h3,
    h4,
    .font-heading {
      font-family: "Bricolage Grotesque", sans-serif;
    }

    /* Using the CTA button style from trust/index.html */
    .cta-button {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 9999px;
      font-size: 1.125rem;
      /* text-lg */
      transition: all 0.3s;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      transform: scale(1);
    }

    .cta-button:hover {
      transform: scale(1.05);
    }

    /* Modal transitions */
    .modal-hidden {
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease-out, visibility 0s linear 0.3s;
    }

    .modal-visible {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease-out;
    }

    /* NEW: Style for the Report Cover Image */
    .report-image-container {
      position: relative;
      background-color: #e5e7eb;
      /* gray-200 */
      border: 1px solid #d1d5db;
      /* gray-300 */
      border-radius: 0.5rem;
      /* rounded-lg */
      overflow: hidden;
      aspect-ratio: 16 / 9;
      /* Widescreen for image */
    }

    .report-image-container img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Cover the area */
    }
  </style>
</head>

<body class="bg-brand-base text-brand-dark font-sans">

  <!-- 🌿 TRUST NAV COMPONENT (from trust/index.html) -->
  <div id="site-nav"></div>

  <!-- MAIN CONTENT -->
  <main>

    <!-- 1. HERO SECTION -->
    <section class="bg-brand-light/60 py-16 md:py-24">
      <div class="container mx-auto px-4 md:px-8 max-w-5xl text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold text-brand-dark mb-4 font-heading">
          Reports & Research
        </h1>
        <p class="text-lg md:text-xl text-brand-dark/80 max-w-3xl mx-auto">
          Transparency in action. Explore our annual reports, impact data, and publications.
        </p>
      </div>
    </section>

    <!-- 2. REPORTS GRID -->
    <section class="py-16 bg-brand-base">
      <div class="container mx-auto px-4 md:px-8 max-w-6xl">

        <!-- Skeleton Loader -->
        <div id="reports-skeleton" class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- Skeleton Card 1 -->
          <div class="bg-white rounded-2xl shadow-md p-6 animate-pulse">
            <div class="h-8 bg-gray-300 rounded-md w-3/4 mb-4"></div>
            <div class="h-4 bg-gray-300 rounded-md w-full mb-6"></div>
            <!-- Updated Skeleton: Image placeholder -->
            <div class="report-image-container bg-gray-200"></div>
            <div class="h-10 bg-gray-300 rounded-full w-1/2 mt-6"></div>
          </div>
          <!-- Skeleton Card 2 -->
          <div class="bg-white rounded-2xl shadow-md p-6 animate-pulse">
            <div class="h-8 bg-gray-300 rounded-md w-1/2 mb-4"></div>
            <div class="h-4 bg-gray-300 rounded-md w-full mb-6"></div>
            <!-- Updated Skeleton: Image placeholder -->
            <div class="report-image-container bg-gray-200"></div>
            <div class="h-10 bg-gray-300 rounded-full w-1/2 mt-6"></div>
          </div>
        </div>

        <!-- Actual Reports Grid (Populated by JS) -->
        <div id="reports-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8">
          <!-- Report cards will be injected here -->
        </div>

        <!-- Loading/End Messages -->
        <div id="loading-message" class="hidden text-center py-8 text-gray-500">
          <p>Loading reports...</p>
        </div>
        <div id="end-message" class="hidden text-center py-8 text-gray-500">
          <p>No more reports found.</p>
        </div>
        <div id="sentinel" class="h-10"></div> <!-- Infinite scroll trigger -->

      </div>
    </section>

  </main>

  <!-- FOOTER (Trust Theme) -->
  <div id="site-footer"></div>

  <!-- 🌍 EXPLORE Button MODAL (Vanilla JS) -->
  

  <!-- 🧠 VANILLA JS for Mobile Menu, Modal, and Lenis -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {

      // --- State & API Variables ---
      let currentPage = 1;
      const perPage = 20; // Fetch more items to get enough PDFs
      let isLoading = false;
      let hasMore = true;
      let pdfCount = 0; // Track how many PDFs we've found
      const apiUrl = 'https://cms.greenammo.in/wp-json/wp/v2/media';

      // --- DOM Elements ---
      const reportsGrid = document.getElementById('reports-grid');
      const reportsSkeleton = document.getElementById('reports-skeleton');
      const loadingMessage = document.getElementById('loading-message');
      const endMessage = document.getElementById('end-message');
      const sentinel = document.getElementById('sentinel'); // Infinite scroll trigger

      // --- API Fetching (Filter Client-Side) ---
      async function fetchReports() {
        if (isLoading || !hasMore) return;
        isLoading = true;

        if (currentPage === 1) {
          reportsSkeleton.classList.remove('hidden');
        } else {
          loadingMessage.classList.remove('hidden');
        }
        endMessage.classList.add('hidden');

        try {
          // **FIXED: Fetching ALL media directly without proxy**
          // Add &media_type=application to only fetch document files from WordPress
const fetchUrl = `${apiUrl}?per_page=${perPage}&page=${currentPage}&media_type=application`;
          const res = await fetch(fetchUrl);

          if (!res.ok) {
            let errorText = `HTTP error! status: ${res.status}`;
            try {
              const errorJson = await res.json();
              if (errorJson && errorJson.message) {
                errorText += `. Message: ${errorJson.message}`;
              }
            } catch (e) { }
            throw new Error(errorText);
          }

          const data = await res.json();

          if (data.code) {
            throw new Error(`WordPress API Error: ${data.message}`);
          }

          if (!Array.isArray(data)) {
            throw new Error("Invalid data format received. Expected an array.");
          }

          // **FIXED: Filter for PDFs on the client-side**
          const pdfs = data.filter(item => item.mime_type === 'application/pdf');

          if (pdfs.length > 0) {
            pdfs.forEach(renderReportCard);
            pdfCount += pdfs.length;
          }

          // Check if we've reached the end of the media library
          const totalPages = res.headers.get('X-WP-TotalPages');
          if (data.length < perPage || (totalPages && currentPage >= parseInt(totalPages, 10))) {
            hasMore = false;
            if (pdfCount === 0 && currentPage === 1) {
              endMessage.classList.remove('hidden');
            } else if (pdfCount > 0) {
              endMessage.textContent = 'All reports have been loaded.';
              endMessage.classList.remove('hidden');
            }
          } else {
            currentPage++;

            // 👇 NEW LOGIC: If we found no PDFs, automatically fetch the next page 
            // so the infinite scroll doesn't get stuck.
            if (pdfs.length === 0) {
              fetchReports();
            }
          }

        } catch (error) {
          console.error("Error fetching reports:", error);
          endMessage.textContent = 'Failed to load reports. Please try again later.';
          endMessage.classList.remove('hidden');
          hasMore = false;
        } finally {
          isLoading = false;
          reportsSkeleton.classList.add('hidden');
          loadingMessage.classList.add('hidden');
        }
      }

      // --- Render Report Card (NEW UI) ---
      function renderReportCard(item) {
        const pdfUrl = item.source_url;
        if (!pdfUrl) return;

        // Find the PNG/JPEG cover image
        const imageUrl = item.media_details?.sizes?.medium_large?.source_url
          || item.media_details?.sizes?.full?.source_url
          || "https://placehold.co/600x400/D2E3AB/1D371F?text=Report"; // Fallback placeholder

        const title = item.title?.rendered || 'Untitled Report';
        let description = item.caption?.rendered?.replace(/<[^>]*>?/gm, '') || 'View our latest report.';

        const card = document.createElement('div');
        card.className = 'bg-white rounded-2xl shadow-md p-6 animate-fade-in flex flex-col';

        card.innerHTML = `
                    <h3 class="text-2xl font-bold text-brand-dark font-heading mb-3">${title}</h3>
                    <p class="text-brand-dark/70 text-sm mb-5 min-h-[40px]">${description}</p>
                    <div class="report-image-container mb-6">
                         <img src="${imageUrl}" alt="${title} cover" loading="lazy" />
                    </div>
                    <a href="${pdfUrl}" target="_blank" rel="noopener noreferrer" 
                       class="cta-button bg-brand-accent text-white hover:bg-brand-dark/90 shadow-brand-accent/50 text-center text-base py-2 mt-auto">
                        Download PDF
                    </a>
                `;
        reportsGrid.appendChild(card);
      }

      // --- Infinite Scroll Observer ---
      const infiniteScrollObserver = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoading && hasMore) {
          fetchReports();
        }
      }, { threshold: 0.5 });

      if (sentinel) infiniteScrollObserver.observe(sentinel);

      // --- Initial Fetch ---
      fetchReports(); // Fetch reports on page load

      // --- Mobile Menu Toggle ---
      const menuToggle = document.getElementById('mobile-menu-toggle');
      const mobileMenu = document.getElementById('mobile-menu');
      const menuIconOpen = document.getElementById('menu-icon-open');
      const menuIconClose = document.getElementById('menu-icon-close');

      if (menuToggle && mobileMenu && menuIconOpen && menuIconClose) {
        menuToggle.addEventListener('click', () => {
          mobileMenu.classList.toggle('hidden');
          menuIconOpen.classList.toggle('hidden');
          menuIconClose.classList.toggle('hidden');
        });
      }

      // --- Explore Modal Logic ---
      const exploreModal = document.getElementById('exploreModal');
      const modalCloseBtn = document.getElementById('modal-close-btn');
      const exploreBtns = [
        document.getElementById('explore-btn-desktop'),
        document.getElementById('explore-btn-mobile'),
        document.getElementById('explore-btn-footer')
      ];

      function openModalJS() {
        if (exploreModal) {
          exploreModal.classList.remove('hidden', 'modal-hidden');
          exploreModal.classList.add('flex', 'modal-visible');
          document.body.style.overflow = 'hidden';
        }
      }

      function closeModalJS() {
        if (exploreModal) {
          exploreModal.classList.remove('flex', 'modal-visible');
          exploreModal.classList.add('modal-hidden');
          setTimeout(() => {
            exploreModal.classList.add('hidden');
          }, 300);
          document.body.style.overflow = '';
        }
      }

      exploreBtns.forEach(btn => {
        if (btn) btn.addEventListener('click', openModalJS);
      });
      if (modalCloseBtn) modalCloseBtn.addEventListener('click', closeModalJS);
      if (exploreModal) {
        exploreModal.addEventListener('click', (event) => {
          if (event.target === exploreModal) closeModalJS();
        });
      }

      // --- Lenis Init ---
      if (typeof Lenis !== 'undefined') {
        const lenis = new Lenis()
        function raf(time) {
          lenis.raf(time)
          requestAnimationFrame(raf)
        }
        requestAnimationFrame(raf)
      } else {
        console.warn('Lenis script not loaded.');
      }
    });
  </script>

    <script type="module" src="/js/components.js"></script>
</body>

</html>
