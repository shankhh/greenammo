<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./assets/greenammo.jpeg" /> <!-- Consider updating favicon path -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js removed — gallery uses vanilla JS -->

    <!-- Lenis Smooth Scroll (Optional) -->
    <script src="https://unpkg.com/lenis@1.3.11/dist/lenis.min.js"></script>

    <title>Gallery - GreenAmmo Group</title>

    <!-- 3. Configure Tailwind with Pop Pastel Group Palette & Fonts -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // GreenAmmo Group (Blended Pop Pastel Theme)
                        "group-primary-green": "#4CAF50", // Deep Mint (Primary Branding)
                        "group-primary-blue": "#56A0D3",
                        "group-pastel-green": "#A8D7B0", // Soft Sage (Accents, Backgrounds)
                        "group-pastel-blue": "#9FD8E4", // Sky Mist (Secondary Accent)
                        "group-accent-neutral": "#F0EAD6", // Sandy Beige (Warm Highlights)
                        "group-base-white": "#FDFDFD", // Clean Base (Background)
                        "group-text-dark": "#1F2937", // Dark Gray for Text (Good Contrast)
                        "group-text-medium": "#6B7280", // Medium Gray for Subtext
                    },
                    fontFamily: {
                        // Setup font families
                        'sans': ['Inter', 'sans-serif'],
                        'heading': ['Bricolage Grotesque', 'sans-serif'],
                    },
                    animation: { // Animation for modal & skeleton
                        'fade-in': 'fade-in 0.3s ease-out',
                        'pulse': 'pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        'fade-in': {
                            'from': { opacity: 0, transform: 'translateY(10px)' },
                            'to': { opacity: 1, transform: 'translateY(0)' },
                        },
                        /* Ensure pulse is defined if using animate-pulse */
                        pulse: {
                            '0%, 100%': { opacity: 1 },
                            '50%': { opacity: .5 },
                        }
                    }
                },
            },
        };
    </script>

    <!-- 4. Import Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@400;600;700;800&display=swap"
        rel="stylesheet">

    <!-- 5. Apply new font rules, CTA button styles, Tab styles, Skeleton -->
    <style>
        body {
            font-family: "Inter", sans-serif;
            background-color: #FDFDFD;
            /* group-base-white */
            color: #1F2937;
            /* group-text-dark */
        }

        h1,
        h2,
        h3,
        h4,
        .font-heading {
            font-family: "Bricolage Grotesque", sans-serif;
        }

        .cta-button {
            /* Consistent Button Style */
            display: inline-block;
            padding: 0.75rem 2.5rem;
            border-radius: 9999px;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transform: scale(1);
            text-align: center;
        }

        .cta-button:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        /* Tab Button Styles */
        .tab-button {
            transition: all 0.2s ease-in-out;
            white-space: nowrap;
            padding: 0.5rem 1.25rem;
            /* px-5 py-2 */
            font-size: 1rem;
            /* text-base */
            font-weight: 600;
            /* font-semibold */
            border-radius: 9999px;
            /* rounded-full */
            border-width: 1px;
            border-color: #D1D5DB;
            /* border-gray-300 */
            color: #374151;
            /* text-gray-700 */
        }

        .tab-button.active {
            border-color: #4CAF50;
            /* group-primary-green */
            color: #ffffff;
            /* white text */
            background-color: #4CAF50;
            /* group-primary-green */
        }

        .tab-button:not(.active):hover {
            border-color: #A8D7B0;
            /* group-pastel-green */
            color: #4CAF50;
            /* group-primary-green */
            background-color: #A8D7B033;
            /* group-pastel-green with low opacity */
        }

        /* Added style for modal transitions */
        .modal-hidden {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-out, visibility 0s linear 0.3s;
        }

        .modal-visible {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.3s ease-out;
        }

        /* Carousel content centering */
        #carousel-content img,
        #carousel-content video {
            margin: auto;
        }

        /* Category Filter Pills */
        .category-pill {
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 9999px;
            border: 1px solid #D1D5DB;
            color: #374151;
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .category-pill:hover {
            border-color: #A8D7B0;
            color: #4CAF50;
            background: rgba(168, 215, 176, 0.15);
        }
        .category-pill.active {
            border-color: #4CAF50;
            color: #fff;
            background: #4CAF50;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.25);
        }
    </style>
</head>

<body class="bg-group-base-white text-group-text-dark font-sans">
    <!-- 🌿 NAV COMPONENT for GreenAmmo Group -->
    <div id="site-nav"></div>

    <main class="min-h-screen">

        <!-- HERO SECTION -->
        <section class="bg-group-pastel-green/30 py-16 md:py-24">
            <div class="container mx-auto px-4 md:px-8 max-w-5xl text-center">
                <h1 class="text-4xl md:text-5xl font-extrabold text-group-text-dark mb-4 font-heading">
                    Our Work in Action
                </h1>
                <p class="text-lg md:text-xl text-group-text-medium max-w-3xl mx-auto">
                    A visual journey through our community projects, workshops, and sustainable efforts across the
                    country.
                </p>
            </div>
        </section>

        <!-- GALLERY TABS & CONTENT -->
        <section class="py-16 bg-white">
            <div class="container mx-auto px-4 md:px-8 max-w-6xl">

                <!-- Media Type Toggle (Photos / Videos) -->
                <div class="flex justify-center gap-3 mb-6">
                    <button id="tab-image" onclick="switchTab('image')" class="tab-button active">
                        📷 Photos
                    </button>
                    <button id="tab-video" onclick="switchTab('video')" class="tab-button">
                        🎬 Videos
                    </button>
                </div>

                <!-- Category Filter Pills (dynamically populated) -->
                <div id="category-pills" class="flex flex-wrap justify-center gap-2 mb-10 pb-4 border-b border-gray-200">
                    <!-- Pills injected by JS -->
                </div>

                <!-- Active Category Title -->
                <div id="category-header" class="text-center mb-8 hidden">
                    <h2 id="category-title" class="text-2xl md:text-3xl font-bold text-group-text-dark font-heading"></h2>
                    <p id="category-count" class="text-sm text-group-text-medium mt-1"></p>
                </div>

                <!-- Skeleton Loader -->
                <div id="gallery-skeleton" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 gap-3 max-w-6xl mx-auto">
                    <div class="aspect-square bg-gray-200 rounded-lg animate-pulse"></div>
                    <div class="aspect-square bg-gray-200 rounded-lg animate-pulse"></div>
                    <div class="aspect-square bg-gray-200 rounded-lg animate-pulse"></div>
                    <div class="aspect-square bg-gray-200 rounded-lg animate-pulse"></div>
                    <div class="aspect-square bg-gray-200 rounded-lg animate-pulse"></div>
                    <div class="aspect-square bg-gray-200 rounded-lg animate-pulse"></div>
                </div>

                <!-- Actual Media Grid -->
                <div id="media-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 gap-3 max-w-6xl mx-auto">
                </div>

                <!-- Infinite Scroll Sentinel & Messages -->
                <div id="infinite-scroll-sentinel" class="text-center py-8">
                    <p id="loading-message" class="hidden text-gray-500">Loading more...</p>
                    <p id="end-message" class="hidden text-group-text-medium">You've reached the end.</p>
                </div>
            </div>
        </section>

        <!-- CAROUSEL MODAL -->
        <div id="carousel-modal"
            class="fixed inset-0 bg-black/95 backdrop-blur-md z-50 hidden items-center justify-center modal-hidden">
            
            <!-- Top Bar -->
            <div class="absolute top-0 w-full flex justify-between items-center p-4 z-[60] bg-gradient-to-b from-black/60 to-transparent">
                <div id="carousel-caption" class="text-white text-lg font-heading drop-shadow-md px-4"></div>
                <button onclick="closeCarousel()" class="text-white opacity-70 hover:opacity-100 hover:text-group-pastel-green transition text-4xl focus:outline-none px-4">&times;</button>
            </div>

            <!-- Carousel Content Area (Image/Video) -->
            <div id="carousel-content" class="w-full h-full flex items-center justify-center relative overflow-hidden" onclick="event.stopPropagation()">
                <!-- Media element (img or video) inserted by JS -->
            </div>

            <!-- Navigation Arrows -->
            <button onclick="changeMedia(-1); event.stopPropagation();" id="carousel-prev"
                class="absolute left-4 top-1/2 transform -translate-y-1/2 p-4 text-white text-5xl z-50 opacity-50 hover:opacity-100 hover:scale-110 transition focus:outline-none drop-shadow-lg">
                &#10094;
            </button>
            <button onclick="changeMedia(1); event.stopPropagation();" id="carousel-next"
                class="absolute right-4 top-1/2 transform -translate-y-1/2 p-4 text-white text-5xl z-50 opacity-50 hover:opacity-100 hover:scale-110 transition focus:outline-none drop-shadow-lg">
                &#10095;
            </button>
            
            <!-- Zoom Controls -->
            <div class="absolute bottom-6 right-6 flex gap-3 z-[60]" id="zoom-controls">
                <button onclick="zoomMedia(-1); event.stopPropagation();" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center backdrop-blur transition focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>
                </button>
                <button onclick="zoomMedia(1); event.stopPropagation();" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center backdrop-blur transition focus:outline-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd" /></svg>
                </button>
                <button onclick="resetZoom(); event.stopPropagation();" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center backdrop-blur transition focus:outline-none" title="Reset Zoom">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" /></svg>
                </button>
            </div>
        </div>

    </main>

    <!-- FOOTER (Group Theme) -->
    <div id="site-footer"></div>

    <script type="module" src="/js/components.js"></script>
    <!-- 🧠 Gallery JS (Tag-Based Category Engine) -->
    <script type="module" src="./js/gallery.js"></script>
</body>

</html>
